# 更接近生产的拓扑：nginx 后面三台网关，Postgres 和 Redis 单独限流。
# 容器 CPU 配额加起来大约 2.85 核，把大约 1 个核留给同机的回放程序和操作系统。
# 数字是配额不是保证；docker inspect 里的 NanoCpus / Memory 以实际生效的为准。

name: railhead-realistic

networks:
  default:
    name: railhead-realistic

x-gateway-env: &gateway-env
  HTTP_ADDR: ":8080"
  DATABASE_URL: postgres://railhead:railhead@postgres:5432/railhead?sslmode=disable
  DATABASE_MAX_CONNS: "16"
  REDIS_URL: redis://redis:6379/0
  ADMIN_TOKEN: dev-admin-token
  SEED_API_KEY: sk-railhead-demo
  SEED_KEY_NAME: demo
  SEED_QUOTA: "10000000"
  SEED_RPM: "0"
  SEED_TPM: "0"
  SEED_CONCURRENCY: "0"
  CACHE_ENABLED: "false"
  CHANNELS_FILE: /app/channels.json
  MAX_ATTEMPTS: "3"
  BREAKER_THRESHOLD: "5"
  BREAKER_COOLDOWN: "15s"
  DEFAULT_MAX_TOKENS: "32"
  MAX_TOKENS_CAP: "4096"
  REQUEST_TIMEOUT: "30s"
  LOG_LEVEL: warn
  BILLING_SHARDS: ${BILLING_SHARDS:-32}
  BILLING_BATCH: ${BILLING_BATCH:-2ms}

x-gateway: &gateway
  build: .
  environment: *gateway-env
  volumes:
    - ./configs/channels.docker.json:/app/channels.json:ro
  cpus: 0.35
  mem_limit: 256m
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mock-a:
      condition: service_healthy
    mock-b:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: railhead
      POSTGRES_PASSWORD: railhead
      POSTGRES_DB: railhead
    command: ["postgres", "-c", "max_connections=120", "-c", "shared_buffers=128MB"]
    ports:
      - "15433:5432"
    cpus: 0.70
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railhead -d railhead"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - realistic-pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "16380:6379"
    cpus: 0.20
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mock-a:
    build: .
    entrypoint: ["/app/mockprovider"]
    environment:
      ADDR: ":8090"
      LATENCY_MS: "0"
      TTFT_MS: "25"
      DECODE_US: "200"
      TAIL_PROB: "0.02"
      TAIL_FACTOR: "8"
      RATE_429: "0.002"
      RATE_500: "0.003"
      RATE_TIMEOUT: "0.001"
      TIMEOUT_MS: "1500"
      STREAM_DELAY_MS: "0"
    ports:
      - "18093:8090"
    cpus: 0.35
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  mock-b:
    build: .
    entrypoint: ["/app/mockprovider"]
    environment:
      ADDR: ":8090"
      LATENCY_MS: "0"
      TTFT_MS: "25"
      DECODE_US: "200"
      TAIL_PROB: "0.02"
      TAIL_FACTOR: "8"
      RATE_429: "0.002"
      RATE_500: "0.003"
      RATE_TIMEOUT: "0.001"
      TIMEOUT_MS: "1500"
      STREAM_DELAY_MS: "0"
    ports:
      - "18094:8090"
    cpus: 0.35
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway-1:
    <<: *gateway
  gateway-2:
    <<: *gateway
  gateway-3:
    <<: *gateway

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18083:8080"
    cpus: 0.20
    mem_limit: 64m
    depends_on:
      gateway-1:
        condition: service_healthy
      gateway-2:
        condition: service_healthy
      gateway-3:
        condition: service_healthy

volumes:
  realistic-pg:
    name: railhead-realistic-pg
