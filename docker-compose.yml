name: railhead

networks:
  default:
    name: railhead

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: railhead
      POSTGRES_PASSWORD: railhead
      POSTGRES_DB: railhead
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railhead -d railhead"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mock-a:
    build: .
    entrypoint: ["/app/mockprovider"]
    environment:
      ADDR: ":8090"
      LATENCY_MS: "5"
      ERROR_RATE: "0"
      STREAM_DELAY_MS: "1"
      DEFAULT_COMPLETION_TOKENS: "16"
    ports:
      - "18091:8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  mock-b:
    build: .
    entrypoint: ["/app/mockprovider"]
    environment:
      ADDR: ":8090"
      LATENCY_MS: "5"
      ERROR_RATE: "0"
      STREAM_DELAY_MS: "1"
      DEFAULT_COMPLETION_TOKENS: "16"
    ports:
      - "18092:8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://railhead:railhead@postgres:5432/railhead?sslmode=disable
      DATABASE_MAX_CONNS: "32"
      REDIS_URL: redis://redis:6379/0
      ADMIN_TOKEN: dev-admin-token
      SEED_API_KEY: sk-railhead-demo
      SEED_KEY_NAME: demo
      SEED_QUOTA: "10000000"
      SEED_RPM: "0"
      SEED_TPM: "0"
      SEED_CONCURRENCY: "0"
      CACHE_ENABLED: "true"
      CACHE_TTL: "60s"
      CHANNELS_FILE: /app/channels.json
      MAX_ATTEMPTS: "3"
      BREAKER_THRESHOLD: "5"
      BREAKER_COOLDOWN: "15s"
      DEFAULT_MAX_TOKENS: "32"
      LOG_LEVEL: "info"
    volumes:
      - ./configs/channels.docker.json:/app/channels.json:ro
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-a:
        condition: service_healthy
      mock-b:
        condition: service_healthy

volumes:
  pgdata:
    name: railhead-pgdata
