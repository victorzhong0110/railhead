# 三个网关实例。失败两次后把该实例摘掉 5 秒，请求转到还活着的实例。
upstream railhead {
    least_conn;
    server gateway-1:8080 max_fails=2 fail_timeout=5s;
    server gateway-2:8080 max_fails=2 fail_timeout=5s;
    server gateway-3:8080 max_fails=2 fail_timeout=5s;
}

server {
    listen 8080;
    client_max_body_size 2m;

    location / {
        proxy_pass http://railhead;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # SSE 不能被缓冲，否则首 token 时间会被 nginx 吃掉。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 8s;
    }
}
